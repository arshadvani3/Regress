[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regress-ai"
version = "0.0.1"
description = "Your agent's production failures become its regression suite. Automatically."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Arsh Advani", email = "arshadvani3@gmail.com" },
]
keywords = ["llm", "evals", "observability", "opentelemetry", "regression-testing", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "opentelemetry-proto>=1.27,<2",
    "protobuf>=5,<6",
]

[project.urls]
Homepage = "https://github.com/arshadvani3/regress"
Repository = "https://github.com/arshadvani3/regress"
Issues = "https://github.com/arshadvani3/regress/issues"

[project.scripts]
regress = "regress.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regress"]

# CPython on this platform treats leading-underscore .pth filenames as
# hidden and skips them at startup, which breaks hatchling's default
# editable-install finder script. Use the plain-path .pth strategy instead.
[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
